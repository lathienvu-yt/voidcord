[package]
name = "VoidCord"
version = "0.2.1"
description = "A customizable, offline-friendly Discord client shell"
authors = ["lathienvu_XD"]
edition = "2026"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["config-toml", "devtools"] }
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "fs"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2"
cacophony = "0.3"
cpal = "0.18"
rubato = "5.0.1"
tauri-plugin-devtools = "2.2.1"
tauri-plugin-dialog = "2"
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-single-instance = "2.0" # Use version 2.0 matching your Tauri v2 setup

log = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
