[package]
name = "voidcord-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "1"
futures-util = "0.3"
iana-time-zone = "0.1.65"
log = "1"
reqwest = "1"
serde = "1"
serde_json = "1"
thiserror = "1"
tokio = "1"
tokio-tungstenite = "0.24"
uuid = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "fs", "net", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
